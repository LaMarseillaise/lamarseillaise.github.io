<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <title>Faravahar</title>

  <defs>
    <g id="wing">
      <path d="
        M 0 0
        l 225 0
        c 0 0 0 90 -90 90
        l -135 0
      " stroke="#000" fill="none" stroke-width="15" />

      <path d="
        M 180 0
        c 0 0 0 60 -60 60
        l -120 0
      " stroke="#000" fill="none" stroke-width="10" />

      <path d="
        M 135 0
        c 0 0 0 30 -30 30
        l -90 0
      " stroke="#000" fill="none" stroke-width="5" />
    </g>
  </defs>

  <g id="faravahar">
    <!-- Central disk -->
    <circle cx="300" cy="300" r="75" fill="none" stroke="#000" stroke-width="15" />

    <!-- Tail feathers -->
    <g>
      <path d="
        M 265 365
        l -45 90
        c 0 0 80 45 160 0
        l -45 -90
      " fill="none" stroke="#000" stroke-width="15" />

      <path d="
        M 250 395 c 0 0 50 30 100 0
        M 235 425 c 0 0 65 30 130 0
        M 285 370 l -25 95
        M 300 375 l 0 100
        M 315 370 l 25 95
      " fill="none" stroke="#000" stroke-width="5" />
    </g>

    <!-- Wings -->
    <g>
      <use href="#wing" x="365" y="255" />
      <use href="#wing" transform="translate(235 255) scale(-1,1)" />
    </g>

    <!-- Figure -->
    <g>
      <!-- Hat -->
      <g transform="translate(300 60) rotate(15)">
        <rect x="0" y="0" height="40" width="60" />
        <line x1="0" y1="47.5" x2="60" y2="47.5" stroke="#000" stroke-width="5" />
      </g>

      <!-- Face -->
      <path d="
        M 295 110
        c 0,0 -5,0 -5,15
        l -10,15
        l 10,5
      " fill="none" stroke="#000" stroke-width="5" />

      <!-- Beard -->
      <path d="
        M 290 145
        c 0,0 -65,80 20,25
        c 0,0 0,-10 30,-10
        c 20,-20 10,-20 5,-40
        c -30,-10 -35,0 -25,10
      " fill="#000" stroke="#000" stroke-width="1" />

      <!-- Body -->
      <path d="
        M 290,190
        l -30,150
        c 0,0 40,35 80,0
        l 0,-170
        l -50,20
      " stroke="#000" fill="#000" stroke-width="5" />

      <!-- Left Hand -->
      <path d="
        M 290 195
        c 0 0 -40 0 -70 -10
        c 0 0 -10 0 -10 15
        c 0 0 10 30 75 80
      " fill="#000" stroke="#000" stroke-width="1" />

      <!-- Ring -->
      <circle cx="210" cy="190" r="20" fill="none" stroke="#000" stroke-width="10" />
    </g>
  </g>
</svg>