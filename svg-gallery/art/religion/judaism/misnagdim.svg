<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <title>Star of David with Torah</title>

  <g id="star-of-david">
    <polygon points="300,30 60,440 540,440" fill="none" stroke="#000" stroke-width="30" />
    <polygon points="300,30 60,440 540,440" fill="none" stroke="#000" stroke-width="30"
      transform="rotate(180 300 300)" />
  </g>

  <g id="torah" transform="translate(230, 240)">
    <rect x="0" y="15" height="90" width="20" />
    <rect x="7" y="0" width="6" height="120" rx="5" />

    <rect x="25" y="15" height="90" width="90" />

    <rect x="120" y="15" height="90" width="20" />
    <rect x="127" y="0" width="6" height="120" rx="5" />
  </g>
</svg>