<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <title>Star of David with Chai</title>

  <g id="star-of-david">
    <polygon points="300,30 60,440 540,440" fill="none" stroke="#000" stroke-width="30" />
    <polygon points="300,30 60,440 540,440" fill="none" stroke="#000" stroke-width="30"
      transform="rotate(180 300 300)" />
  </g>

  <g id="chai" transform="translate(225, 240)">
    <path d="
      M 0 0
      C 0 0, 0 15, 15 15
      C 15 15, 30 15, 30 75
      C 30 75, 30 45, 15 45
      C 15 45, 0 45, 0 0 Z

      M 45 0
      C 45 0, 30 15, 75 15
      C 105 15, 135 10, 135 30
      C 135 30, 135 45, 120 45
      L 60 45
      C 60 45, 25 45, 45 0 Z

      M 60 45
      C 60 45, 50 65, 50 75
      L 50 120
      L 45 125
      C 45 125, 65 125, 65 105
      L 65 60
      L 70 45 Z

      M 110 45
      L 110 125
      C 120 125, 135 120, 120 45
    " fill="#000" stroke="#000" stroke-width="1" />
  </g>
</svg>