<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <title>Cookware 🍳</title>

  <g>
    <!-- Pot -->
    <ellipse cx="300" cy="240" rx="180" ry="45" fill="none" stroke="black" stroke-width="10" />
    <path fill="none" stroke="black" stroke-width="10" d="
      M 120,240
      v 240
      a 180,45 0 0 0 360,0
      v -240
      M 150,285 q -150,-10 -30,-30
      M 450,285 q 150,-10 30,-30
    " />

    <!-- liquid -->
    <path fill="none" stroke="black" stroke-width="5" d="
      M 120,240
      q 30,30 60,0
      q 30,30 60,0
      q 30,30 60,0
      q 30,30 60,0
      q 30,30 60,0
      q 30,30 60,0
      M 240,30 c 60,60 -60,105 0,150
      M 300,30 c 60,60 -60,105 0,150
      M 360,30 c 60,60 -60,105 0,150
    " />

    <!-- Ladle -->
    <g>
      <path fill="none" stroke="black" stroke-width="15" d="
        M 360,285
        q 60,-255 120,-135
        a 15,15 0 1 1 -5,0
      " />
    </g>
  </g>
</svg>