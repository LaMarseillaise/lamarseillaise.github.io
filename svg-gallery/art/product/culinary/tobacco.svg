<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <title>Tobacco</title>

  <g id="cigar" transform="rotate(15,300,300)">
    <!-- Base -->
    <path fill="none" stroke="black" stroke-width="15" d="
      M 30,300
      q 270,-90 540,0
      v 30
      q -270,90 -540,0
      z
    " />

    <!-- Charred Tip -->
    <path fill="black" stroke="none" stroke-width="0" d="
      M 570,300
      l -60,-15
      v 60
      l 60,-15
      z
    " />

    <!-- Rolling lines -->
    <path fill="none" stroke="black" stroke-width="5" d="
      M 60,285 l 60,75
      M 120,270 l 72,90
      M 180,260 l 96,120
      M 255,250 l 96,120
      M 330,250 l 96,120
      M 405,260 l 72,90
    " />
  </g>

  <!-- Smoke -->
  <path fill="none" stroke="black" stroke-width="10" d="
    M 525,330
    c 60,-90 -90,-150 0,-240
    M 570,345
    c 60,-90 -90,-150 0,-240
  " />
</svg>