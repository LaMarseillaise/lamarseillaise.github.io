    <use href="#bead" x="210" y="175" />

    <use href="#bead" x="210" y="245" />
    <use href="#bead" x="210" y="305" />
    <use href="#bead" x="210" y="465" />
    <use href="#bead" x="210" y="525" />

    <use href="#bead" x="300" y="75" />

    <use href="#bead" x="300" y="245" />
    <use href="#bead" x="300" y="405" />
    <use href="#bead" x="300" y="465" />
    <use href="#bead" x="300" y="525" />

