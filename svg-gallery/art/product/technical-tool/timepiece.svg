<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <title>Pocket Watch ⏱️</title>

  <defs>
    <line id="marker" x1="300" y1="175" x2="300" y2="200" stroke="#000" stroke-width="10" />
  </defs>

  <g>
    <!-- crown -->
    <circle cx="300" cy="60" r="50" fill="none" stroke="#000" stroke-width="15" />
    <circle cx="300" cy="70" r="25" fill="#000" stroke="#000" stroke-width="0" />
    <line x1="300" y1="70" x2="300" y2="130" stroke="#000" stroke-width="25" />

    <!-- face -->
    <circle cx="300" cy="360" r="230" fill="none" stroke="#000" stroke-width="15" />
    <circle cx="300" cy="360" r="200" fill="none" stroke="#000" stroke-width="15" />
    <circle cx="300" cy="360" r="20" fill="#000" />

    <!-- hour -->
    <line x1="300" y1="360" x2="300" y2="255" stroke="#000" stroke-width="15" transform="rotate(45 300 360)" />
    <!-- minute -->
    <line x1="300" y1="360" x2="300" y2="210" stroke="#000" stroke-width="15" transform="rotate(180 300 360)" />

    <!-- markers -->
    <use href="#marker" transform="rotate(0,300,360)" />
    <use href="#marker" transform="rotate(30,300,360)" />
    <use href="#marker" transform="rotate(60,300,360)" />
    <use href="#marker" transform="rotate(90,300,360)" />
    <use href="#marker" transform="rotate(120,300,360)" />
    <use href="#marker" transform="rotate(150,300,360)" />
    <use href="#marker" transform="rotate(180,300,360)" />
    <use href="#marker" transform="rotate(210,300,360)" />
    <use href="#marker" transform="rotate(240,300,360)" />
    <use href="#marker" transform="rotate(270,300,360)" />
    <use href="#marker" transform="rotate(300,300,360)" />
    <use href="#marker" transform="rotate(330,300,360)" />
  </g>
</svg>