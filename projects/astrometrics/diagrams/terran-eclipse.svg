<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-labelledby="title">
<title id="title">From the Moon during a total lunar eclipse: dark Earth with a reddish atmospheric rim above dim lunar ground</title>
<style>text{font:16px system-ui,sans-serif;fill:#edf2f4}.small{font-size:13px}.large{font-size:24px}.muted{fill:#b6c7d1}</style>
<defs><radialGradient id="glow"><stop offset=".68" stop-color="#f39565" stop-opacity=".8"/><stop offset="1" stop-color="#f39565" stop-opacity="0"/></radialGradient></defs><circle cx="160" cy="105" r="85" fill="url(#glow)" /><circle cx="160" cy="105" r="60" fill="#0b1823" stroke="#e9956a" stroke-width="3"/><text x="160" y="202" text-anchor="middle" class="">Earth hides the Sun</text><text x="160" y="226" text-anchor="middle" class="small muted">Sunlight filters through the atmospheric rim</text><path d="M0 270Q85 246 160 265T320 257V300H0Z" fill="#70534b"/></svg>
