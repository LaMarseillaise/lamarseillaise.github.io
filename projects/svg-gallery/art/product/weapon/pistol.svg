<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <title>Pistol</title>

  <defs>
    <g id="pistol">
      <!-- lock -->
      <path fill="none" stroke="#000" stroke-width="5" d="
        M 185,315 c 0,20 30,20 30,0
        M 199,315 v 10
        M 199,300 v -25 m 0,20 c 0,-10 15,-10 15,-5
        M 220,315 v 10
        M 235,300 l -10,-5 5,-10
      " />

      <!-- grip -->
      <path fill="#000" stroke="#000" stroke-width="0" d="
        M 180,295
        c -35,10 -30,30 -45,45
        c 0,15 15,15 20,15
        c 15,0 -5,-30 25,-40
        Z
      " />

      <!-- barrel -->
      <line x1="180" y1="300" x2="285" y2="300" stroke="#000" stroke-width="10" />
      <line x1="180" y1="310" x2="270" y2="310" stroke="#000" stroke-width="10" />
      <line x1="265" y1="312" x2="280" y2="312" stroke="#000" stroke-width="5" />
    </g>
  </defs>

  <g id="double-pistol">
    <g transform="rotate(30,300,300) scale(-2,2) translate(-300,-150)">
      <use href="#pistol" x="0" y="0" />
    </g>

    <g transform="rotate(-30,300,300) scale(2) translate(0,-150)">
      <use href="#pistol" x="0" y="0" />
    </g>
  </g>
</svg>