<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <title>Mining Tools 🪏⛏️</title>

  <g>
    <!-- Shovel -->
    <g transform="rotate(45,300,360)">
      <!-- blade -->
      <path fill="none" stroke="#000" stroke-width="5" d="
        M 300,5
        c 60,30 75,60 90,120
        v 90
        h -180
        v -90
        c 15,-60 30,-90 90,-120
        z
      " />

      <!-- handle -->
      <path fill="#000" stroke="#000" stroke-width="0" d="
        M 285,220
        v 360
        a 15,15 0 0 0 30,0
        v -360
      " />

      <!-- handle impression -->
      <path fill="none" stroke="#000" stroke-width="5" d="
        M 285,215
        v -60
        a 15,15 0 0 1 30,0
        v 60
        z
      " />
    </g>

    <!-- Pickaxe -->
    <g transform="rotate(-45,300,360)">
      <!-- blade -->
      <path fill="none" stroke="#000" stroke-width="5" d="
        M 285,120
        h 30
        v 15
        c 45,0 60,0 180,60
        v 5
        c -30,0 -60,-40 -180,-30
        v 15
        h -30
        v -15
        c -120,-10 -150,30 -180,30
        v -5
        c 120,-60 135,-60 180,-60
        v -15
        z
      " />

      <!-- handle -->
      <path fill="#000" stroke="#000" stroke-width="0" d="
        M 285,190
        v 390
        a 15,15 0 0 0 30,0
        v -390
        m 0,-75
        a 15,15 0 0 0 -30,0
      " />
    </g>
  </g>
</svg>