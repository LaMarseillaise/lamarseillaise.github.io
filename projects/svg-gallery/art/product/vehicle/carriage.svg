<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <title>Carriage</title>

  <defs>
    <mask id="hub-mask">
      <rect x="-100" y="-100" width="200" height="200" fill="white" />
      <circle cx="0" cy="0" r="10" fill="none" stroke="black" stroke-width="5" />
    </mask>

    <g id="spoke">
      <line x1="-90" y1="0" x2="90" y2="0" stroke="#000" stroke-width="10" />
    </g>

    <g id="wheel" mask="url(#hub-mask)">
      <circle cx="0" cy="0" r="90" fill="none" stroke="#000" stroke-width="10" />
      <circle cx="0" cy="0" r="20" fill="#000" stroke="none" stroke-width="0" />
      <use href="#spoke" transform="rotate(0)" />
      <use href="#spoke" transform="rotate(30)" />
      <use href="#spoke" transform="rotate(60)" />
      <use href="#spoke" transform="rotate(90)" />
      <use href="#spoke" transform="rotate(120)" />
      <use href="#spoke" transform="rotate(150)" />
    </g>
  </defs>

  <g>
    <use href="#wheel" transform="translate(90 480) rotate(20) scale(0.75)" />
    <use href="#wheel" transform="translate(495 450) rotate(5)" />

    <g id="body">
      <line x1="10" y1="390" x2="160" y2="390" stroke="#000" stroke-width="15" stroke-linecap="round" />
      <line x1="175" y1="450" x2="385" y2="450" stroke="#000" stroke-width="15" stroke-linecap="round" />

      <path fill="none" stroke="black" stroke-width="10" d="
        M 180,150
        v 240
        q 150,90 300,0
        v -240
        q -150,-30 -300,0
        z

        M 15,345 l 30,15 q 30,15 60,0 v -60 h 60 v 75
      " />

      <rect fill="none" stroke="black" stroke-width="5" x="285" y="165" width="90" height="120" />
      <rect fill="none" stroke="black" stroke-width="5" x="275" y="155" width="110" height="255" />
    </g>
  </g>
</svg>