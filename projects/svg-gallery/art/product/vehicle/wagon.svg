<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <title>Wagon</title>

  <defs>
    <mask id="hub-mask">
      <rect x="-100" y="-100" width="200" height="200" fill="white" />
      <circle cx="0" cy="0" r="10" fill="none" stroke="black" stroke-width="5" />
    </mask>

    <g id="spoke">
      <line x1="-90" y1="0" x2="90" y2="0" stroke="#000" stroke-width="10" />
    </g>

    <g id="wheel" mask="url(#hub-mask)">
      <circle cx="0" cy="0" r="90" fill="none" stroke="#000" stroke-width="10" />
      <circle cx="0" cy="0" r="20" fill="#000" stroke="none" stroke-width="0" />
      <use href="#spoke" transform="rotate(0)" />
      <use href="#spoke" transform="rotate(30)" />
      <use href="#spoke" transform="rotate(60)" />
      <use href="#spoke" transform="rotate(90)" />
      <use href="#spoke" transform="rotate(120)" />
      <use href="#spoke" transform="rotate(150)" />
    </g>
  </defs>

  <g>
    <use href="#wheel" transform="translate(150 450) rotate(20)" />
    <use href="#wheel" transform="translate(450 450) rotate(5)" />

    <g id="body">
      <line x1="260" y1="450" x2="340" y2="450" stroke="#000" stroke-width="15" stroke-linecap="round" />
      <line x1="10" y1="450" x2="40" y2="450" stroke="#000" stroke-width="15" stroke-linecap="round" />

      <path fill="black" stroke="none" stroke-width="0" d="
        M 30,300
        h 540
        v 135
        h -15
        a 106,106 0 0 0 -210,0
        h -90
        a 106,106 0 0 0 -210,0
        h -15
        v -150
      " />
    </g>

    <g id="cover">
      <line x1="15" y1="285" x2="585" y2="285" stroke="#000" stroke-width="10" stroke-linecap="round" />
      <line x1="30" y1="265" x2="30" y2="90" stroke="#000" stroke-width="10" stroke-linecap="round" />
      <line x1="210" y1="265" x2="210" y2="90" stroke="#000" stroke-width="10" stroke-linecap="round" />
      <line x1="390" y1="265" x2="390" y2="90" stroke="#000" stroke-width="10" stroke-linecap="round" />
      <line x1="570" y1="265" x2="570" y2="90" stroke="#000" stroke-width="10" stroke-linecap="round" />

      <path fill="none" stroke="#000" stroke-width="10" d="
        M 30,70
        q 90,30 180,0
        q 90,30 180,0
        q 90,30 180,0
      " />
    </g>
  </g>
</svg>