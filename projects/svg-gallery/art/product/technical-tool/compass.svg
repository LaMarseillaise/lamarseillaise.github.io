<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <title>Compass 🧭</title>

  <defs>
    <line id="marker" x1="300" y1="165" x2="300" y2="200" stroke="#000" stroke-width="10" />
  </defs>

  <g>
    <circle cx="300" cy="60" r="50" fill="none" stroke="#000" stroke-width="15" />
    <line x1="300" y1="90" x2="300" y2="130" stroke="#000" stroke-width="25" />

    <circle cx="300" cy="360" r="230" fill="none" stroke="#000" stroke-width="15" />
    <circle cx="300" cy="360" r="200" fill="none" stroke="#000" stroke-width="15" />

    <!-- rhomboid hand -->
    <g transform="rotate(-66 300 360)">
      <polygon points="300,160 270,355 330,355" fill="#000" />
      <polygon points="300,560 275,360 325,360" fill="none" stroke="#000" stroke-width="10" />
    </g>

    <!-- markers -->
    <use href="#marker" transform="rotate(0,300,360)" />
    <use href="#marker" transform="rotate(45,300,360)" />
    <use href="#marker" transform="rotate(90,300,360)" />
    <use href="#marker" transform="rotate(135,300,360)" />
    <use href="#marker" transform="rotate(180,300,360)" />
    <use href="#marker" transform="rotate(225,300,360)" />
    <use href="#marker" transform="rotate(270,300,360)" />
    <use href="#marker" transform="rotate(315,300,360)" />
  </g>
</svg>