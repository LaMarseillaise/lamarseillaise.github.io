    <line x1="300" y1="15" x2="300" y2="585" stroke="#000" stroke-width="30" transform="rotate(45,300,300)" />
    <line x1="300" y1="15" x2="300" y2="585" stroke="#000" stroke-width="30" transform="rotate(-45,300,300)" />
