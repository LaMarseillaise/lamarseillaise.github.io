<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <title>Dharmachakra with Lotus</title>

  <g id="dharmachakra">
    <defs>
      <mask id="dharmachakra-mask">
        <rect width="600" height="600" fill="#fff" />
        <circle r="75" cx="300" cy="300" fill="#000" />
      </mask>
    </defs>

    <g mask="url(#dharmachakra-mask)">
      <circle r="240" cx="300" cy="300" stroke="#000000" stroke-width="60" fill="none" />

      <line x1="300" y1="0" x2="300" y2="600" stroke="#000000" stroke-width="30" />
      <line x1="0" y1="300" x2="600" y2="300" stroke="#000000" stroke-width="30" />

      <line x1="300" y1="0" x2="300" y2="600" stroke="#000000" stroke-width="30" transform="rotate(45 300 300)" />
      <line x1="0" y1="300" x2="600" y2="300" stroke="#000000" stroke-width="30" transform="rotate(45 300 300)" />

      <circle r="90" cx="300" cy="300" fill="none" stroke="#000" stroke-width="30" />
    </g>
  </g>

  <g id="lotus">
    <!-- Lotus petals in center of dharmachakra -->
    <g transform="translate(300,300)">
      <!-- Outer ring of petals -->
      <g stroke="#000" fill="none" stroke-width="8">
        <path d="M 0,-50 Q -15,-35 0,-20 Q 15,-35 0,-50" transform="rotate(0)" />
        <path d="M 0,-50 Q -15,-35 0,-20 Q 15,-35 0,-50" transform="rotate(45)" />
        <path d="M 0,-50 Q -15,-35 0,-20 Q 15,-35 0,-50" transform="rotate(90)" />
        <path d="M 0,-50 Q -15,-35 0,-20 Q 15,-35 0,-50" transform="rotate(135)" />
        <path d="M 0,-50 Q -15,-35 0,-20 Q 15,-35 0,-50" transform="rotate(180)" />
        <path d="M 0,-50 Q -15,-35 0,-20 Q 15,-35 0,-50" transform="rotate(225)" />
        <path d="M 0,-50 Q -15,-35 0,-20 Q 15,-35 0,-50" transform="rotate(270)" />
        <path d="M 0,-50 Q -15,-35 0,-20 Q 15,-35 0,-50" transform="rotate(315)" />
      </g>

      <!-- Inner ring of petals -->
      <g stroke="#000" fill="none" stroke-width="6">
        <path d="M 0,-30 Q -10,-20 0,-10 Q 10,-20 0,-30" transform="rotate(22.5)" />
        <path d="M 0,-30 Q -10,-20 0,-10 Q 10,-20 0,-30" transform="rotate(67.5)" />
        <path d="M 0,-30 Q -10,-20 0,-10 Q 10,-20 0,-30" transform="rotate(112.5)" />
        <path d="M 0,-30 Q -10,-20 0,-10 Q 10,-20 0,-30" transform="rotate(157.5)" />
        <path d="M 0,-30 Q -10,-20 0,-10 Q 10,-20 0,-30" transform="rotate(202.5)" />
        <path d="M 0,-30 Q -10,-20 0,-10 Q 10,-20 0,-30" transform="rotate(247.5)" />
        <path d="M 0,-30 Q -10,-20 0,-10 Q 10,-20 0,-30" transform="rotate(292.5)" />
        <path d="M 0,-30 Q -10,-20 0,-10 Q 10,-20 0,-30" transform="rotate(337.5)" />
      </g>

      <!-- Central lotus seed pod -->
      <circle cx="0" cy="0" r="8" fill="#000" stroke="#000" stroke-width="2" />
    </g>
  </g>
</svg>