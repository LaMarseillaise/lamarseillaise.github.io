<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timekeeping component checks</title><style>body{background:#0c2428;color:#f2f3ef;font:16px system-ui;margin:2rem}button{font:inherit;padding:1rem}section{margin:2rem 0}</style><script type="module" src="../../projects/calendars-and-clocks/app.mjs"></script></head><body><h1>Component independence and lifecycle</h1><p>Developer fixture: two independent instances of each timekeeping element.</p><button id="reconnect">Reconnect first instances</button><button id="disconnect">Disconnect first instances</button><p id="state" role="status">Connected.</p><div id="first"><section><h2>First clock</h2><clock-comparison></clock-comparison></section><section><h2>First walkthrough</h2><doomsday-walkthrough></doomsday-walkthrough></section><section><h2>First calendar</h2><seasonal-calendar></seasonal-calendar></section><section><h2>First timezone experiment</h2><timezone-experiment></timezone-experiment></section></div><div id="second"><section><h2>Second clock</h2><clock-comparison></clock-comparison></section><section><h2>Second walkthrough</h2><doomsday-walkthrough></doomsday-walkthrough></section><section><h2>Second calendar</h2><seasonal-calendar></seasonal-calendar></section><section><h2>Second timezone experiment</h2><timezone-experiment></timezone-experiment></section></div><script>
const first=document.querySelector('#first');
document.querySelector('#disconnect').addEventListener('click',()=>{first.remove();document.querySelector('#state').textContent='First instances disconnected.';});
document.querySelector('#reconnect').addEventListener('click',()=>{first.remove();document.querySelector('#second').before(first);document.querySelector('#state').textContent='First instances reconnected.';});
</script></body></html>
